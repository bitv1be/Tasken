services:
  frontend:
    image: ghcr.io/bitv1be/tasken-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - nginx
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/bitv1be/tasken-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - nginx
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tasken
      MYSQL_USER: tasken
      MYSQL_PASSWORD: development
      MYSQL_ROOT_PASSWORD: development
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nginx
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/certbot/www:/var/www/certbot:ro
      - ./infrastructure/certbot/conf:/etc/letsencrypt:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    command:
      - /bin/sh
      - -c
      - |
        (
          while true; do
            sleep 6h
            nginx -t && nginx -s reload
          done
        ) &

        exec nginx -g 'daemon off;'

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    networks:
      - nginx
    volumes:
      - ./infrastructure/certbot/www:/var/www/certbot
      - ./infrastructure/certbot/conf:/etc/letsencrypt
    depends_on:
      proxy:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        trap exit TERM

        while true; do
          certbot renew \
            --webroot \
            --webroot-path=/var/www/certbot \
            --quiet

          sleep 12h & wait $$!
        done

  certbot-init:
    image: certbot/certbot:latest
    restart: "no"
    profiles:
      - certbot-init
    networks:
      - nginx
    volumes:
      - ./infrastructure/certbot/www:/var/www/certbot
      - ./infrastructure/certbot/conf:/etc/letsencrypt
    depends_on:
      proxy:
        condition: service_healthy
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --email=${CERTBOT_EMAIL}
      - --agree-tos
      - --no-eff-email
      - --non-interactive
      - --domain=${DOMAIN:-tasken.ru}

networks:
  backend:
    driver: bridge

  nginx:
    driver: bridge

volumes:
  mysql-data:
