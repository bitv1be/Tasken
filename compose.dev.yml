name: ${COMPOSE_PROJECT_NAME:-tasken}

x-build-proxy: &build-proxy
  HTTP_PROXY: ${BUILD_HTTP_PROXY}
  HTTPS_PROXY: ${BUILD_HTTPS_PROXY}
  http_proxy: ${BUILD_HTTP_PROXY}
  https_proxy: ${BUILD_HTTPS_PROXY}
  NO_PROXY: ${BUILD_NO_PROXY}
  no_proxy: ${BUILD_NO_PROXY}

services:
  frontend:
    build:
      context: ./frontend
      network: host
      args:
        <<: *build-proxy
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - nginx
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      network: host
      args:
        <<: *build-proxy
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tasken
      DB_USERNAME: tasken
      DB_PASSWORD: development
    env_file:
      - ./backend/.env
    networks:
      - nginx
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasken
      POSTGRES_USER: tasken
      POSTGRES_PASSWORD: development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasken -d tasken"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - nginx
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/up || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  backend:
    driver: bridge

  nginx:
    driver: bridge

volumes:
  postgres_data:
    name: tasken_postgres_data
